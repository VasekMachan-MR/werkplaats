<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Gothic+A1:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#d1d3d5}
#es{background:#d1d3d5;color:#333;font-family:'Gothic A1',sans-serif;font-size:16px;line-height:1.5;min-height:100vh}
#es *{box-sizing:border-box}
#es .mo{font-family:Montserrat,sans-serif}
#es header{background:#092b50;color:#fff}
#es .in{max-width:880px;margin:0 auto;padding:0 24px}
#es .hl{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:16px 24px}
#es .logo{font-weight:800;font-size:24px;letter-spacing:-.8px;line-height:1}
#es .kn{font-weight:500;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:#d1d3d5}
#es .jaz button{all:unset;cursor:pointer;color:#d1d3d5;font:600 13px Montserrat,sans-serif;padding:10px 6px;min-width:32px;text-align:center}
#es .jaz button[aria-pressed=true]{color:#fff;text-decoration:underline}
#es h1{margin:40px 0 6px;font:700 42px/1.1 Montserrat,sans-serif;letter-spacing:-.8px}
#es .sub{font:600 22px Montserrat,sans-serif;color:#092b50;margin:0 0 28px}
#es h2{margin:0 0 14px;font:700 26px Montserrat,sans-serif;letter-spacing:-.4px;color:#092b50}
#es section{margin-bottom:32px}
#es .box{background:#eceeef;padding:4px 20px}
#es .grid{display:flex;flex-wrap:wrap;column-gap:40px}
#es .grid>div{flex:1 1 280px;min-width:0}
#es .row{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid #c3c6c9}
#es .row span:first-child{color:#4a4f55}
#es .row b{font-weight:600;text-align:right;word-break:break-word}
#es .row a{color:#092b50;text-decoration:none}
#es .nav{background:#eceeef;margin-bottom:10px}
#es .nav>button{all:unset;box-sizing:border-box;cursor:pointer;width:100%;padding:16px 20px;display:flex;flex-wrap:wrap;gap:6px 20px;align-items:center;min-height:44px}
#es .dat{font:700 17px Montserrat,sans-serif;color:#092b50;min-width:110px}
#es .nt{flex:1 1 200px;font-weight:600}
#es .km{color:#4a4f55;font-size:14px}
#es .st{font:600 11px Montserrat,sans-serif;letter-spacing:1px;text-transform:uppercase;padding:4px 10px;background:#d1d3d5}
#es .st.ok{background:#d9e7d4;color:#24481a}
#es .pan{padding:0 20px 20px;display:flex;flex-direction:column;gap:18px}
#es .sh{font:600 12px Montserrat,sans-serif;letter-spacing:1.5px;text-transform:uppercase;color:#4a4f55;padding-bottom:8px;border-bottom:2px solid #092b50;margin-bottom:6px}
#es ul{margin:0;padding:0;list-style:none}
#es li{padding:8px 0;border-bottom:1px solid #c3c6c9;font-size:15px;line-height:1.4}
#es li small{color:#4a4f55}
#es li.np{font-weight:700;color:#092b50;border-bottom:0;padding-top:14px}
#es .fot{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
#es .fot a,#es .fot video{display:block;aspect-ratio:4/3;background:#c3c6c9;overflow:hidden}
#es .fot img,#es .fot video{width:100%;height:100%;object-fit:cover;display:block}
#es .dok{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;justify-content:space-between;background:#fff;padding:12px 20px;color:#333;min-height:44px;text-decoration:none;margin-bottom:8px}
#es .dok span:last-child{color:#4a4f55}
#es .box .dok{background:#fff;margin:12px 0}
#es .kontakt{background:#092b50;color:#fff;padding:28px 24px;display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between}
#es .kontakt h2{color:#fff;font-size:24px;margin:0 0 6px}
#es .kontakt p{margin:0;color:#d1d3d5}
#es .kontakt a{display:inline-flex;align-items:center;min-height:48px;padding:0 22px;font:600 15px Montserrat,sans-serif;text-decoration:none}
#es .bil{background:#fff;color:#092b50}
#es .obr{border:2px solid #d1d3d5;color:#fff}
#es footer{background:#092b50;color:#d1d3d5;font-size:14px}
#es footer .in{padding:20px 24px;display:flex;flex-wrap:wrap;gap:6px 24px;justify-content:space-between}
#es form{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 32px}
#es input{flex:1 1 260px;min-height:48px;padding:0 14px;border:1px solid #9aa0a6;font:500 16px 'Gothic A1',sans-serif;text-transform:uppercase}
#es form button{all:unset;cursor:pointer;min-height:48px;padding:0 22px;background:#092b50;color:#fff;font:600 15px Montserrat,sans-serif}
#es .info{background:#eceeef;padding:20px;margin-bottom:32px}
@media (max-width:600px){#es h1{font-size:32px}#es .in{padding:0 16px}#es .hl{padding:14px 16px}}
</style>
